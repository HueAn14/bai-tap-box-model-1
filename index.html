<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Box Model Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>So Sánh Hiệu Ứng Box-Sizing trong CSS</h1>

    <!-- Thẻ 1 -->
    <div class="card">
        <h3>Thẻ 1 (content-box)</h3>
        <p>Kích thước tổng = width + padding + border.</p>
    </div>

    <!-- Thẻ 2 -->
    <div class="card">
        <h3>Thẻ 2 (border-box)</h3>
        <p>Kích thước tổng giữ nguyên 280px x 150px.</p>
    </div>

    <!-- Thẻ 3 -->
    <div class="card">
        <h3>Thẻ 3 (border-box)</h3>
        <p>Giống thẻ 2, padding và border tính vào bên trong.</p>
    </div>

</body>
</html>
